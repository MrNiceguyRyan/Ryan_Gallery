name: Release Production (Manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RELEASE to publish the current main commit'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gallery-production
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation on main
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_REF: ${{ github.ref }}
        run: test "$CONFIRMATION" = RELEASE && test "$RELEASE_REF" = refs/heads/main

  validate:
    needs: authorize
    uses: ./.github/workflows/validate.yml
    with:
      require_mapbox: true
    secrets: inherit

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ryanxugallery.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Block production while known dependency advisories remain
        run: npm audit --audit-level=low
      - name: Verify required build configuration
        env:
          MAPBOX_TOKEN: ${{ vars.PUBLIC_MAPBOX_TOKEN || secrets.PUBLIC_MAPBOX_TOKEN }}
        run: test -n "$MAPBOX_TOKEN"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gallery-build-${{ github.sha }}
          path: dist
      - name: Record rollback versions
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.114.0'
          command: deployments list
      - name: Publish tested artifact (never rebuild here)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.114.0'
          command: deploy --keep-vars
      - name: Verify custom domain and deployed assets
        run: npm run check:site -- https://ryanxugallery.com
