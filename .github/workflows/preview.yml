name: Deploy Preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-preview
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      require_mapbox: true
    secrets: inherit

  deploy-preview:
    needs: validate
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gallery-build-${{ github.sha }}
          path: dist
      - name: Verify required build configuration
        env:
          MAPBOX_TOKEN: ${{ vars.PUBLIC_MAPBOX_TOKEN || secrets.PUBLIC_MAPBOX_TOKEN }}
        run: test -n "$MAPBOX_TOKEN"
      - name: Deploy tested preview artifact
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.114.0'
          command: deploy --env preview --keep-vars
      - name: Verify preview pages and application assets
        run: node scripts/site-health.mjs https://ryan-gallery-preview.ryan2420159421.workers.dev
